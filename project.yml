name: SystemProfilerExplorer

options:
  bundleIdPrefix: com.netctl
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

targets:
  SystemProfilerExplorer:
    type: application
    platform: macOS
    sources:
      - path: SystemProfilerExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netctl.SystemProfilerExplorer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: System Profiler Explorer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 hideouts-io.
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO

  SystemProfilerExplorerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SystemProfilerExplorerTests
    dependencies:
      - target: SystemProfilerExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netctl.SystemProfilerExplorerTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  SystemProfilerExplorer:
    build:
      targets:
        SystemProfilerExplorer: all
        SystemProfilerExplorerTests: [test]
    test:
      targets:
        - SystemProfilerExplorerTests
