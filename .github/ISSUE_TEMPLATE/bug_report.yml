name: Bug report
description: Report a reproducible problem without uploading private profiler data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve System Profiler Explorer. Do not paste or attach a raw/full profiler report. Reports can contain serial numbers, user names, network details, installed-software inventory, and other identifying data.

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Provide only the macOS version and build, not a hardware serial number.
      placeholder: macOS 26.4 (25E246)
    validations:
      required: true

  - type: dropdown
    id: subject
    attributes:
      label: Subject
      options:
        - Overview
        - Hardware
        - Storage
        - Network
        - Software
        - Security
        - Power
        - Reports
        - Export
        - Comparison
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the actions using sanitized examples.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Remove private values, host paths, and machine identifiers from error text.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this issue and removed raw profiler output and identifying system data.
          required: true
