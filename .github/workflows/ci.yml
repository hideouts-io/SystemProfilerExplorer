name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branding-type-check:
    name: Branding TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/branding
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install locked branding dependencies
        run: npm ci --ignore-scripts
      - name: Check branding TypeScript
        run: npm run check

  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify publication boundary
        run: ./scripts/check-publication-boundary.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: >-
          xcodebuild
          -project SystemProfilerExplorer.xcodeproj
          -scheme SystemProfilerExplorer
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build test
