name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify publication boundary
        run: ./scripts/check-publication-boundary.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: >-
          xcodebuild
          -project SystemProfilerExplorer.xcodeproj
          -scheme SystemProfilerExplorer
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build test
